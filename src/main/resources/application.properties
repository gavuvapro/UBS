# Application
spring.application.name=utility-billing-system

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/utility_billing
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=8080
server.servlet.context-path=/

# JWT
jwt.secret=${JWT_SECRET:42371bdd34cd0bc30ec11eb2a77153aee9d8c95a96e0177ccd6ebbbfd828d939}
jwt.expiration=86400000

# Resend
resend.api-key=${RESEND_API_KEY:re_QeFD8Cq2_9d99L6KshrX2HovoNZmNtEds}
resend.from=Utility Billing System <notifications@updates.daisy.now>

# Logging
logging.level.com.utilitybilling=DEBUG
logging.level.org.springframework.security=DEBUG
management.endpoints.web.exposure.include=health,info,metrics,beans,env,loggers,threaddump
